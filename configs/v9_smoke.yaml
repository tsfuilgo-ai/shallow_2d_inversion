seed: 42
device: cuda
save_dir: /data/2/lwt/projects/shallow_2d_inversion/runs/v9_smoke
resume: null

data:
  root_dir: /data/1/lwt/archive/2D_data_v9
  formal_only: true
  train_dir: null
  val_dir: null
  test_dir: null
  max_samples_per_split:
    train: 4
    val: 2
    test: 2
  input_channels:
    - filtered_waveform
  optional_channels:
    - filtered_waveform
    - processed_envelope
  missing_channel_policy: zeros
  input_normalization: per_sample_percentile
  input_percentile: 99.5
  input_clip: 6.0
  vp_min: 1000.0
  vp_max: 2800.0
  clip_normalized_vp: true

  class_label:
    raw_ids: marine_facies_v1
    remap_to_contiguous: true
    ignore_index: -1
    unknown_policy: ignore

  quality_filters:
    enabled: true
    formal_only: true
    max_time_window_padding_fraction: 0.05
    min_valid_semantic_label_fraction: 0.05
    max_ignore_label_fraction: 0.95
    reject_missing_metrics: false

  vp_loss_mask:
    enabled: true
    source: below_seafloor
    min_valid_fraction: 0.05

  target_time_samples: 256
  target_traces: 64
  target_depth: 64
  target_width: 64

  split:
    train_ratio: 0.8
    val_ratio: 0.1
    test_ratio: 0.1
    seed: 42
    group_keys:
      - model_id
      - scene_id
      - seed
    infer_scene_id_from_name: true
    allow_sample_level_split_when_group_missing: false

model:
  in_channels: 1
  input_time_samples: 256
  input_traces: 64
  latent_depth: 32
  encoder_channels:
    - 4
    - 8
    - 16
    - 32
    - 64
  mlp_hidden_dims:
    - 256
    - 128
    - 64
    - 64
  decoder_stem_channels: 64
  decoder_channels:
    - 64
    - 32
    - 32
  decoder_upsample_mode: depth_only
  encoder_norm: batch
  decoder_norm: batch
  compressor_norm: trace_batch
  dropout: 0.2
  output_activation: sigmoid
  auto_resize_input: false

semantic:
  enabled: true
  num_classes: 27
  weight: 0.2
  ignore_index: -1
  require_labels: true
  use_visibility_weight: false
  visibility_mask_channel: 8
  uncertainty_mask_channel: 9
  uncertainty_weight: 0.5
  decoder_channels:
    - 64
    - 32
    - 32

train:
  batch_size: 1
  epochs: 1
  lr: 0.001
  weight_decay: 0.0
  num_workers: 0
  pin_memory: true
  grad_clip_norm: 1.0
  amp: false
  log_interval: 1
  visualize_interval: 1
  visualize_batches: 1
  visualize_samples: 1

loss:
  primary: smooth_l1
  l1_weight: 1.0
  mse_weight: 0.5
  gradient_weight: 0.1
  msssim_weight: 0.2
  msssim_scales: 3
  msssim_window_size: 11
  use_vp_mask: true

eval:
  ssim: true
  curve_positions:
    - 0.25
    - 0.5
    - 0.75
