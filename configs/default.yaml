seed: 42
device: cuda
save_dir: /data/2/lwt/projects/shallow_2d_inversion/runs/gprinvnet_like_baseline
resume: null

data:
  root_dir: /data/1/lwt/archive/2D_data
  formal_only: true
  train_dir: null
  val_dir: null
  test_dir: null
  input_channels:
    - filtered_waveform
  optional_channels:
    - filtered_waveform
    - processed_envelope
  missing_channel_policy: zeros
  input_normalization: per_sample_percentile
  input_percentile: 99.5
  input_clip: 6.0
  vp_min: 1000.0
  vp_max: 2800.0
  clip_normalized_vp: true

  class_label:
    # Generated formal windows store raw facies ids plus -1 ignore labels.
    # The dataset remaps raw ids to contiguous train ids and preserves -1
    # for CrossEntropyLoss(ignore_index=-1).
    raw_ids: marine_facies_v1   # 0..26, matching sha-sec/3D.py FACIES_NAMES
    remap_to_contiguous: true
    ignore_index: -1
    unknown_policy: ignore

  quality_filters:
    # Formal shallow-water windows may contain zero-padded time samples above
    # t=0. Keep those samples only when the padded fraction is small.
    enabled: true
    formal_only: true
    max_time_window_padding_fraction: 0.05
    min_valid_semantic_label_fraction: 0.05
    max_ignore_label_fraction: 0.95
    reject_missing_metrics: false

  vp_loss_mask:
    # Exclude the water/padding region above the seafloor from Vp regression.
    # Semantic loss already uses class_label.ignore_index.
    enabled: true
    source: below_seafloor
    min_valid_fraction: 0.05

  # Baseline sizes for a quick, memory-safe first training run.
  # Formal files are [C,4128,5120] and [880,5120]; these values define
  # memory-safe network resize targets, not another preprocessing dataset.
  target_time_samples: 800
  target_traces: 256
  target_depth: 256
  target_width: 256

  split:
    train_ratio: 0.8
    val_ratio: 0.1
    test_ratio: 0.1
    seed: 42
    group_keys:
      - model_id
      - scene_id
      - seed
    infer_scene_id_from_name: true
    allow_sample_level_split_when_group_missing: false

model:
  in_channels: 1
  input_time_samples: 800
  input_traces: 256
  latent_depth: 128
  encoder_channels:
    - 4
    - 8
    - 16
    - 32
    - 64
  mlp_hidden_dims:
    - 1024
    - 512
    - 256
    - 256
  decoder_stem_channels: 128
  decoder_channels:
    - 64
    - 64
    - 32
    - 32
  decoder_upsample_mode: depth_only
  encoder_norm: batch
  decoder_norm: batch
  compressor_norm: trace_batch
  dropout: 0.2
  output_activation: sigmoid
  auto_resize_input: false

semantic:
  enabled: true
  num_classes: 27
  weight: 0.2
  ignore_index: -1
  require_labels: true
  use_visibility_weight: false
  visibility_mask_channel: 8
  uncertainty_mask_channel: 9
  uncertainty_weight: 0.5
  decoder_channels:
    - 64
    - 64
    - 32
    - 32

train:
  batch_size: 2
  epochs: 50
  lr: 0.001
  weight_decay: 0.0
  num_workers: 2
  pin_memory: true
  grad_clip_norm: 1.0
  amp: false
  log_interval: 10
  visualize_interval: 1
  visualize_batches: 1
  visualize_samples: 2

loss:
  primary: smooth_l1
  l1_weight: 1.0
  mse_weight: 0.5
  gradient_weight: 0.1
  msssim_weight: 0.2
  msssim_scales: 3
  msssim_window_size: 11
  use_vp_mask: true

eval:
  ssim: true
  curve_positions:
    - 0.25
    - 0.5
    - 0.75
